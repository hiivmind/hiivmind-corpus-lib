name: Pytest

on:
  push:
    branches: [develop, main]
  pull_request:
    paths:
      - src/hiivmind_corpus_lib/**
      - tests/**
      - README.md
      - pyproject.toml
      - hatch.toml
      - pytest.ini
      - .github/workflows/python-run-pytest.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # test_github is the base install (tests needing an extra skip); test_extras installs every extra.
        env: [test_github, test_extras]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          check-latest: true

      - name: Install Hatch
        run: python -m pip install --disable-pip-version-check --no-input hatch==1.18.0

      - name: Create test environment
        run: hatch env create ${{ matrix.env }}

      - name: Run coverage tests
        run: hatch run ${{ matrix.env }}:test-cov
