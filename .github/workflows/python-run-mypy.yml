name: Mypy

on:
  push:
    branches: [develop, main]
  pull_request:
    paths:
      - src/hiivmind_corpus_lib/**
      - tests/**
      - pyproject.toml
      - hatch.toml
      - .github/workflows/python-run-mypy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typing:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          check-latest: true

      - name: Install Hatch
        run: python -m pip install --disable-pip-version-check --no-input hatch==1.18.0

      - name: Create mypy environment
        run: hatch env create mypy

      - name: Check source and tests
        run: hatch run mypy:check
