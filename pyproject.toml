[project]
name = "hiivmind-corpus-lib"
version = "0.2.0"
description = "The corpus capabilities: one Corpus object over a corpus directory"
requires-python = ">=3.12"
dependencies = ["pyyaml", "markdown-it-py"]

[project.optional-dependencies]
embeddings = ["fastembed>=0.4.0", "lancedb>=0.23.0", "pyarrow>=15.0.0"]
pdf = ["pymupdf>=1.24.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hiivmind_corpus_lib"]

[dependency-groups]
dev = ["pytest", "lancedb>=0.23.0", "pyarrow>=15.0.0", "tokenizers", "pymupdf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "--basetemp=test-tmp"
