[project]
name = "hiivmind-corpus-lib"
version = "0.1.0"
description = "The corpus capabilities: the index, its status, the base branch, and the scripts and documents the corpus nodes use"
requires-python = ">=3.12"
dependencies = ["pyyaml"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hiivmind_corpus"]
