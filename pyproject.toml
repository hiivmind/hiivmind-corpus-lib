[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hiivmind-corpus-lib"
dynamic = ["version"]
description = "The corpus capabilities: one Corpus object over a corpus directory"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Nathaniel Ramm", email = "nathaniel.ramm@discretedatascience.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = ["pyyaml", "markdown-it-py"]

[project.optional-dependencies]
embeddings = ["fastembed>=0.4.0", "lancedb>=0.23.0", "pyarrow>=15.0.0"]
pdf = ["pymupdf>=1.24.0"]

[project.urls]
Documentation = "https://github.com/hiivmind/hiivmind-corpus-lib#readme"
Issues = "https://github.com/hiivmind/hiivmind-corpus-lib/issues"
Source = "https://github.com/hiivmind/hiivmind-corpus-lib"

#================
# Tool: Coverage
#================
[tool.coverage.run]
source_pkgs = ["hiivmind_corpus_lib", "tests"]
branch = true
parallel = true
omit = ["src/hiivmind_corpus_lib/__version__.py"]

[tool.coverage.paths]
hiivmind_corpus_lib = [
    "src/hiivmind_corpus_lib",
    "*/hiivmind-corpus-lib/src/hiivmind_corpus_lib",
]
tests = ["tests", "*/hiivmind-corpus-lib/tests"]

[tool.coverage.report]
exclude_lines = ["no cov", "if __name__ == .__main__:", "if (t\\.|typing\\.)?TYPE_CHECKING:"]

#================
# Tool: ruff
#================
# The project's own settings, so a user-level ruff config never applies here.
[tool.ruff]
target-version = "py312"

#================
# Tool: mypy
#================
# pyarrow ships no annotations; the embeddings extra imports it lazily.
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
