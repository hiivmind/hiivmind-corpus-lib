[pytest]
# Directories that pytest should search for tests in; `support` and `pdf_support` import from it.
testpaths = tests
pythonpath = tests

# Files and functions that pytest should discover.
python_files = test_*.py
python_functions = test_*

# One fixed temporary directory: run one pytest process at a time.
addopts = --strict-markers --tb=short --basetemp=test-tmp
